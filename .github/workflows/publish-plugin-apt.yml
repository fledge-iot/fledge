name: Publish plugin to apt repository

on:
  repository_dispatch:
    types: [plugin-publish]
  workflow_dispatch:
    inputs:
      repository:
        description: "Plugin repository (owner/name) whose workflow run holds the .deb artifacts"
        type: string
        required: true
      run_id:
        description: "Workflow run id in the plugin repository to pull artifacts from"
        type: string
        required: true
      package:
        description: "Debian package name the artifacts must carry"
        type: string
        required: true
      version:
        description: "Package version the artifacts must carry"
        type: string
        required: true
      dry_run:
        description: "Sign with the real Key Vault key and upload the result as an artifact, without publishing anything"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CODENAMES: "focal bullseye bookworm jammy noble"
  COMPONENT: main
  CONTAINER: apt
  PUBLIC_APT_URL: https://packages.helinplatform.com/apt

jobs:
  publish:
    name: Sign and publish plugin packages
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 60
    concurrency:
      group: apt-repo-publish
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      KV_NAME: ${{ vars.APT_SIGNING_KV_NAME }}
      KEY_NAME: ${{ vars.APT_SIGNING_KEY_NAME }}
      KEY_VERSION: ${{ vars.APT_SIGNING_KEY_VERSION }}
      KEY_FPR: ${{ vars.APT_SIGNING_KEY_FPR }}
      SRC_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || github.event.client_payload.repository }}
      SRC_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.client_payload.run_id }}
      PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.package || github.event.client_payload.package }}
      PKG_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      SUITE_SUFFIX: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version, '~rc.') && '-rc' || '' }}
      NOT_AUTOMATIC: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version, '~rc.') && 'yes' || '' }}

    steps:
      - name: Validate publish request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SRC_REPOSITORY}" =~ ^${GITHUB_REPOSITORY_OWNER}/fledge-(filter|south|north|rule|notify|service)-[a-z0-9-]+$ ]]; then
            echo "ERROR: repository '${SRC_REPOSITORY}' is not an allowed plugin repository" >&2
            exit 1
          fi
          if [[ ! "${PACKAGE}" =~ ^fledge-(filter|south|north|rule|notify|service)-[a-z0-9-]+$ ]]; then
            echo "ERROR: package '${PACKAGE}' is not an allowed plugin package name" >&2
            exit 1
          fi
          if [[ ! "${SRC_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: run_id '${SRC_RUN_ID}' is not numeric" >&2
            exit 1
          fi
          if [[ ! "${PKG_VERSION}" =~ ^[0-9]+(\.[0-9]+)*([~+-][A-Za-z0-9.~+-]*)?$ ]]; then
            echo "ERROR: version '${PKG_VERSION}' is not a valid package version" >&2
            exit 1
          fi
          echo "publishing ${PACKAGE} ${PKG_VERSION} from ${SRC_REPOSITORY} run ${SRC_RUN_ID} (dry_run=${DRY_RUN})"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Download plugin package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: ${{ env.PACKAGE }}-*
          path: dist
          repository: ${{ env.SRC_REPOSITORY }}
          run-id: ${{ env.SRC_RUN_ID }}
          github-token: ${{ secrets.PLUGIN_ARTIFACT_TOKEN }}

      - name: Verify downloaded packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          debs=(dist/**/*.deb)
          if [[ ${#debs[@]} -eq 0 ]]; then
            echo "ERROR: no .deb artifacts found in run ${SRC_RUN_ID} of ${SRC_REPOSITORY}" >&2
            exit 1
          fi
          for deb in "${debs[@]}"; do
            pkg="$(dpkg-deb --field "$deb" Package)"
            ver="$(dpkg-deb --field "$deb" Version)"
            deps="$(dpkg-deb --field "$deb" Depends)"
            if [[ "$pkg" != "${PACKAGE}" ]]; then
              echo "ERROR: ${deb} has Package '${pkg}', expected '${PACKAGE}'" >&2
              exit 1
            fi
            if [[ "$ver" != "${PKG_VERSION}" ]]; then
              echo "ERROR: ${deb} has Version '${ver}', expected '${PKG_VERSION}'" >&2
              exit 1
            fi
            if [[ "$deps" != *fledge* ]]; then
              echo "ERROR: ${deb} Depends '${deps}' does not include fledge" >&2
              exit 1
            fi
          done
          echo "verified ${#debs[@]} package file(s)"

      - name: Install apt metadata tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev gpgv

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pull existing repository from blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apt-repo-out
          az storage blob download-batch \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --source "${CONTAINER}" \
            --destination apt-repo-out \
            --pattern "dists/*" \
            --auth-mode login \
            --overwrite
          az storage blob download-batch \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --source "${CONTAINER}" \
            --destination apt-repo-out \
            --pattern "pool/*" \
            --auth-mode login \
            --overwrite

      - name: Add packages and regenerate metadata
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .ci/apt/build_repo.sh
          touched=""
          for codename in $CODENAMES; do
            stage="staging/${codename}"
            mkdir -p "$stage"
            find dist -path "*${PACKAGE}-${codename}-*" -name '*.deb' -exec cp -v {} "$stage/" \;
            if compgen -G "${stage}/*.deb" > /dev/null; then
              CODENAME="${codename}${SUITE_SUFFIX}" COMPONENT="$COMPONENT" \
                .ci/apt/build_repo.sh "$stage" apt-repo-out
              touched="${touched}${touched:+ }${codename}${SUITE_SUFFIX}"
            fi
          done
          if [[ -z "$touched" ]]; then
            echo "ERROR: no artifact matched any codename in [${CODENAMES}]" >&2
            exit 1
          fi
          echo "touched=${touched}" >> "$GITHUB_OUTPUT"

      - name: Install signing dependencies
        shell: bash
        run: python3 -m pip install -r .ci/apt/requirements.txt

      - name: Sign repository metadata
        shell: bash
        run: |
          set -euo pipefail
          cp .ci/apt/helin-archive-keyring.gpg apt-repo-out/fledge.gpg
          for codename in ${{ steps.stage.outputs.touched }}; do
            python3 .ci/apt/sign_release.py --kv-name "$KV_NAME" --key-name "$KEY_NAME" \
              ${KEY_VERSION:+--key-version "$KEY_VERSION"} \
              sign --in "apt-repo-out/dists/${codename}/Release" \
                   --out "apt-repo-out/dists/${codename}/Release.gpg" \
                   --keyring apt-repo-out/fledge.gpg \
                   ${KEY_FPR:+--expect-fingerprint "$KEY_FPR"}
          done

      - name: Verify signatures before publishing
        shell: bash
        run: |
          set -euo pipefail
          for codename in ${{ steps.stage.outputs.touched }}; do
            gpgv --keyring "${PWD}/apt-repo-out/fledge.gpg" \
              "apt-repo-out/dists/${codename}/Release.gpg" \
              "apt-repo-out/dists/${codename}/Release"
            echo "OK: ${codename} Release signature verifies against the published keyring"
          done

      - name: Upload dry-run result as artifact
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: plugin-publish-dry-run
          path: |
            apt-repo-out/dists/**
            apt-repo-out/pool/**/${{ env.PACKAGE }}/**
          if-no-files-found: error

      - name: Upload packages to blob
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --destination "${CONTAINER}" \
            --source apt-repo-out \
            --pattern "pool/*" \
            --auth-mode login \
            --overwrite

      - name: Upload signed metadata to blob
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --destination "${CONTAINER}" \
            --source apt-repo-out \
            --pattern "dists/*" \
            --auth-mode login \
            --overwrite

      - name: Verify published package is served
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for codename in ${{ steps.stage.outputs.touched }}; do
            packages_url="${PUBLIC_APT_URL}/dists/${codename}/${COMPONENT}/binary-amd64/Packages"
            if ! curl -fsSL "$packages_url" | grep -x "Package: ${PACKAGE}"; then
              echo "ERROR: ${PACKAGE} missing from ${packages_url}" >&2
              exit 1
            fi
            echo "OK: ${PACKAGE} listed in ${codename} Packages index"
          done
