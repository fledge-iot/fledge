module(load="imuxsock")

global(workDirectory="/var/spool/rsyslog")

$FileOwner root
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022

template(name="FledgeFormat" type="string"
         string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n")

*.* action(type="omfile"
           file="/var/log/syslog"
           template="FledgeFormat"
           flushOnTXEnd="on"
           asyncWriting="off"
           rotation.sizeLimit="33554432"
           rotation.sizeLimitCommand="/usr/local/bin/fledge-log-rotate")
